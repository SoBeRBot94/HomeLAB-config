---
- name: set the system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: cap journald disk usage
  ansible.builtin.template:
    src: journald-limits.conf.j2
    dest: /etc/systemd/journald.conf.d/10-limits.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-journald

- name: allow fstrim to run inside lxc guests
  when:
    - ansible_facts['virtualization_type'] == 'lxc'
  block:
    - name: create fstrim timer drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/fstrim.timer.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: clear the container condition on fstrim.timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/fstrim.timer.d/10-allow-container.conf
        content: |
          [Unit]
          ConditionVirtualization=
        owner: root
        group: root
        mode: "0644"
      notify: restart fstrim timer

    - name: enable the fstrim timer
      ansible.builtin.systemd_service:
        name: fstrim.timer
        enabled: true
        state: started
        daemon_reload: true
